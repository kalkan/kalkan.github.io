---
layout: compress
---
{% include base_path %}
<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}" class="no-js space-page">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }} | {{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="icon" href="/images/favicon.ico">
    <link rel="stylesheet" href="/assets/css/space.css?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="stars stars-1"></div>
    <div class="stars stars-2"></div>
    <div class="stars stars-3"></div>
    <div class="nebula"></div>

    <nav class="space-nav">
      <a href="/" class="brand">
        <span class="brand-dot"></span>
        <span>Dr. Kaan Kalkan</span>
      </a>
      <ul>
        <li><a href="#about">Hakkımda</a></li>
        <li><a href="#research">Araştırma</a></li>
        <li><a href="#explore">Keşfet</a></li>
        <li><a href="#contact">İletişim</a></li>
      </ul>
    </nav>

    <main class="space-main">
      {{ content }}
    </main>

    <footer class="space-footer">
      <div class="orbit-footer">
        <span>&copy; {{ site.time | date: '%Y' }} Kaan Kalkan</span>
        <span class="sep">•</span>
        <a href="https://github.com/kalkan">GitHub</a>
        <span class="sep">•</span>
        <a href="https://scholar.google.com/citations?user=s4RggLwAAAAJ">Scholar</a>
        <span class="sep">•</span>
        <a href="https://www.researchgate.net/profile/Kaan-Kalkan-2">ResearchGate</a>
        <span class="sep">•</span>
        <a href="http://orcid.org/0000-0002-2732-5425">ORCID</a>
      </div>
    </footer>
  </body>
</html>
